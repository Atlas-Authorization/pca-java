name: CI

# Maven build + JUnit suites, and the JUnit-free conformance runner over the shared corpus (conformance/vectors.json).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BC_VERSION: '1.80'

jobs:
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      JDK_JAVA_OPTIONS: ${{ matrix.java != '21' && '--enable-native-access=ALL-UNNAMED' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 21 = the compile floor (release 21, lazysodium-java 5.2.0); 23 runs LESS through the FFM API (JDK 22+), with native access enabled
        java: ['21', '23']
        include:
          - { os: windows-latest, java: '23' }
          - { os: macos-latest, java: '23' }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # SnapshotTest/MutationHarness locate the full adversarial set and the mutation-oracle inputs by the source layout
      # (../../tools/pca-audit from the repo): rebuild it from the flagship at the same ref and test there
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono java-pca $([ "$RUNNER_OS" = Windows ] || [ "${{ matrix.java }}" = 21 ] || echo --less)
      # CI makes WasmSubprocessTest fail when the pinned host is absent: build the reference host from the flagship crate (exports PCA_WASMTIME_HOST_BIN and PCA_WASMTIME_HOST_SHA256)
      - name: pca-wasmtime-host (real host for the subprocess sandbox tests)
        shell: bash
        run: .github/scripts/build-wasmtime-host.sh "$RUNNER_TEMP/wasmtime-host" "$RUNNER_TEMP/mono/packages/pca-sandbox/wasmtime-host"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP oracle corpus (generated, never committed)
        shell: bash
        run: |
          P="$PCA_MONO_SDK/test-data/ref-dpop-rsa.json.gz"; command -v cygpath >/dev/null && P="$(cygpath -u "$P")"
          .github/scripts/dpop-rsa-corpus.sh "$P"
      - name: Secret-key oracle corpora (generated, never committed)
        shell: bash
        run: |
          D="$PCA_MONO_SDK/test-data"; command -v cygpath >/dev/null && D="$(cygpath -u "$D")"
          .github/scripts/gen-secret-corpus.sh "$D" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat frost-dkg:frost-dkg
      - name: libsodium (ristretto255 / Ed25519 backend)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; elif [ "$RUNNER_OS" = macOS ]; then brew install libsodium; fi
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true  # a transient download failure must not leave the later steps on the runner's default JDK
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: JDK again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven
      - name: The job runs on the expected JDK
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "'${{ matrix.java }} || { echo "::error::the expected JDK is not the active JDK"; exit 1; }
      - name: Build + unit tests
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test
      - name: Agent-side signing (producer vectors byte for byte, TS PCActns verified, native round trips; a missing file fails)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/producer-vectors.json
          mvn -B -ntp -q surefire:test -Dtest='ProducerVectorsTest,ProducerTest'
          test -s "$PCA_PRODUCER_OUT"
        env:
          PCA_PRODUCER_OUT: ${{ runner.temp }}/producer-native-java.json
      # the post-quantum PCActns this SDK produced (randomised signatures): the reference implementation verifies them
      # (packages/pca/conformance/producer-native/, producer-native.test.ts)
      - name: Upload the post-quantum PCActns for the reference
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.java == '23' }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-native-java
          path: ${{ runner.temp }}/producer-native-java.json
          if-no-files-found: error
      # 0.5 parity suites. Already part of the step above; run on their own so a regression shows as its own step. Every
      # shared vector file they read (decision, passport incl. passport_hardware_vectors, attestation-evidence, intent-state,
      # ledger, optimistic, mesh, goal) must exist: a missing file or table FAILS, it is never skipped.
      - name: Decision + model-rules vectors (units, tighten-only, decision lattice, escalation answers, signed model-rules cases)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q surefire:test -Dtest='DecisionConformanceTest,EscalationTest,DecisionKillTest,ModelRulesVectorsTest'
      - name: Caveat language v2 vectors (discharges, sealed, narrow, max_uses, derive, spiffe_bound; shared caveat-lang-vectors.json, a missing file fails, never skips)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/caveat-lang-vectors.json
          mvn -B -ntp -q surefire:test -Dtest='CaveatLangVectorsTest'
      - name: Forbid-wins certificate and linked policy template vectors (a missing file fails, never skips)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q surefire:test -Dtest='PolicyAuthoringTest'
      - name: Agent-native primitives (caution, rationale binding, tool-schema firewall, envelope introspection, authority leases; the shared agent-native oracle, every case, a missing file fails)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-agent-native.json.gz
          mvn -B -ntp -q surefire:test -Dtest='AgentNativeDiffTest'
      - name: Hybrid KEM (X25519 + ML-KEM-768/1024, X-Wing draft-09, FIPS 203 key checks) and QRNG entropy (health tests, HKDF mixing, secureSeed, injected-transport HTTP source; the shared oracles, every case, a missing file fails)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-kem.json.gz
          test -s test-data/ref-entropy.json.gz
          mvn -B -ntp -q surefire:test -Dtest='KemDiffTest,EntropyDiffTest'
      - name: Small public helpers (budget_alloc caveat, beacon acceptance and durable acceptor, fraud-proof filing, intent-map attestation, approval store and broker conformance cases, salted ledger commits, v2 goal parser, profile revocation scope, dispute game; a missing corpus fails)
        if: ${{ !cancelled() }}
