        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-core-kotlin-gaps.json.gz
          mvn -B -ntp -q surefire:test -Dtest='SiblingPortsTest,CoreGapsDiffTest'
      - name: zk compliance (statements, public-input derivation, envelope gate, context pins, backends, ceremony checks; the shared oracle, every case, a missing file fails; the pairing itself runs in the ZK workflow)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-zk.json.gz
          mvn -B -ntp -q surefire:test -Dtest='ZkDiffTest'
      - name: Prohibitions and contracts (advanceState, composeAuthority, validateWhen, whenMatches, clause validation, contract advance with CAS guards) and the derive-then-decide pipeline (the shared oracles, every case, a missing file fails)
        if: ${{ !cancelled() }}
