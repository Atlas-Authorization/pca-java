name: CI

# Maven build + JUnit suites, and the JUnit-free conformance runner over the shared corpus (conformance/vectors.json).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BC_VERSION: '1.80'

jobs:
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      JDK_JAVA_OPTIONS: ${{ matrix.java != '17' && '--enable-native-access=ALL-UNNAMED' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 17 = the compile floor (release 17); 23 runs LESS through the FFM API (JDK 22+), with native access enabled
        java: ['17', '23']
        include:
          - { os: windows-latest, java: '23' }
          - { os: macos-latest, java: '23' }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # SnapshotTest/MutationHarness locate the full adversarial set and the mutation-oracle inputs by the source layout
      # (../../tools/pca-audit from the repo): rebuild it from the flagship at the same ref and test there
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono java-pca $([ "$RUNNER_OS" = Windows ] || [ "${{ matrix.java }}" = 17 ] || echo --less)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build + unit tests
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test
      - name: Agent-side signing (producer vectors byte for byte, TS PCActns verified, native round trips; a missing file fails)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/producer-vectors.json
          mvn -B -ntp -q test -Dtest='ProducerVectorsTest,ProducerTest'
          test -s "$PCA_PRODUCER_OUT"
        env:
          PCA_PRODUCER_OUT: ${{ runner.temp }}/producer-native-java.json
      # the post-quantum PCActns this SDK produced (randomised signatures): the reference implementation verifies them
      # (packages/pca/conformance/producer-native/, producer-native.test.ts)
      - name: Upload the post-quantum PCActns for the reference
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.java == '23' }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-native-java
          path: ${{ runner.temp }}/producer-native-java.json
          if-no-files-found: error
      # 0.5 parity suites. Already part of the step above; run on their own so a regression shows as its own step. Every
      # shared vector file they read (decision, passport incl. passport_hardware_vectors, attestation-evidence, intent-state,
      # ledger, optimistic, mesh, goal) must exist: a missing file or table FAILS, it is never skipped.
      - name: Decision + model-rules vectors (units, tighten-only, decision lattice, escalation answers, signed model-rules cases)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='DecisionConformanceTest,EscalationTest,DecisionKillTest,ModelRulesVectorsTest'
      - name: Caveat language v2 vectors (discharges, sealed, narrow, max_uses, derive, spiffe_bound; shared caveat-lang-vectors.json, a missing file fails, never skips)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/caveat-lang-vectors.json
          mvn -B -ntp -q test -Dtest='CaveatLangVectorsTest'
      - name: Forbid-wins certificate and linked policy template vectors (a missing file fails, never skips)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='PolicyAuthoringTest'
      - name: Passport + attestation verifiers (vendor vectors, strict DER, fail-closed tables)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='PassportConformanceTest,PassportKillTest,AttestFoundationTest,AttestStrictDerTest,AttestX509VectorsTest,AttestAmdTest,AttestIntelTest,AttestMaaTest,AttestGcpTest,AttestNvidiaTest'
      - name: Intent-state, ledger, optimistic and mesh vectors
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='IntentStateVectorsTest,LedgerVectorsTest,OptimisticVectorsTest,MeshConformanceTest,MeshNarrowsTest,Track3KillTest'
      - name: Goal vectors (digests, decisions with witnesses, helper functions)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='GoalVectorsTest,GoalKillTest'
      - name: Goal binding v3 (approved_goal) commit, invalid and binding vectors
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='GoalCommitVectorsTest'
      - name: Revocation staleness (age caps, per-class windows, signed epoch, gate, authorize wiring)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='StalenessVectorsTest'
      - name: Operation records and plan lifecycle (vector replay, concurrency, durable store, executor, authorize plans)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='OperationVectorsTest,PlanVectorsTest'
      - name: Assurance labels (signature levels, reports, requirement gate, multi-root level, authorize gate)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='AssuranceVectorsTest'
      - name: Guard options (servlet filter, Spring interceptor, PcaCore; approved goal, staleness, assurance, executor, maturity)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='GuardOptionsTest'
      - name: Step-up client for the principal device (RFC 8032 vectors, stores, fake transport)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='StepUpClientTest'
      - name: Store conformance helper (shipped stores pass, racy and non-durable stores fail)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='StoreConformanceTest'
      - name: K3 operational-plane vectors + fresh_at member (consistency tokens, policy bundles, decision log, list receipts, grant management)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='K3VectorsTest,FreshAtVectorsTest,PcaGrantVectorsTest,BlueprintVectorsTest,A2aVectorsTest,K4VectorsTest,K5VectorsTest,BreakGlassVectorsTest,LeaseVectorsTest,MissingContextVectorsTest,ObligationsVectorsTest,PolicyClassesVectorsTest,ProvenanceVectorsTest,SigstoreVectorsTest'
      - name: K5 workflow gate inside authorize + tokenisation vault and aggregate reads (shared fixtures; a missing file fails, never skips)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/authorize-workflow-fixtures.json
          test -s ../../packages/pca/conformance/vault-aggregate-vectors.json
          mvn -B -ntp -q test -Dtest='AuthorizeWorkflowTest,GuardWorkflowTest,ReadVaultTest'
      - name: Provenance by default + undo windows (arg-provenance-vectors, undo-vectors, authorize gate and undo admission; a missing file fails, never skips)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/arg-provenance-vectors.json
          test -s ../../packages/pca/conformance/undo-vectors.json
          mvn -B -ntp -q test -Dtest='ArgProvenanceVectorsTest,ArgProvenanceKillTest,UndoVectorsTest,UndoKillTest,ProvenanceFlowTest'
      - name: actions-vectors (action kit, ActionDef parse, canonical digest, trait expansion, floor check, schema v2, pack proofs)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q test -Dtest='ActionVectorsTest'
      - name: Conformance corpus
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          mvn -B -ntp -q dependency:copy -Dartifact=org.bouncycastle:bcprov-jdk18on:${BC_VERSION} -DoutputDirectory=.ci
          BC=".ci/bcprov-jdk18on-${BC_VERSION}.jar"
          SEP=':'; [ "$RUNNER_OS" = Windows ] && SEP=';'
          mkdir -p .ci/out
          javac -cp "$BC" -d .ci/out src/net/atlasauth/pca/*.java ConformanceTest.java
          java -Xss8m -cp ".ci/out${SEP}${BC}" ConformanceTest
