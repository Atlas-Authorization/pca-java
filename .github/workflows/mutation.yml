    steps:
      - name: Shard filter
        if: ${{ inputs.only != '' }}
        env:
          ONLY: ${{ inputs.only }}
        run: case ",$ONLY," in *,${{ matrix.shard }},*) ;; *) echo "::notice::not in this experiment"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - name: libsodium (ristretto255 / Ed25519 backend)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; elif [ "$RUNNER_OS" = macOS ]; then brew install libsodium; fi
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true  # a transient download failure must not leave the later steps on the runner's default JDK
        with:
          distribution: temurin
          # 23, not 21: LESS runs through the FFM API (JDK 22+). On 21 LessNative never loaded, so its mutants and every
          # LESS branch of Pq/Pca were NO_COVERAGE or survived untested (ci.yml runs the same build on 23 with --less)
          java-version: '23'
      - name: JDK again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
      - name: The job runs on the expected JDK
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "'23 || { echo "::error::the expected JDK is not the active JDK"; exit 1; }
      - name: Restore the Maven repository resolved by the deps job (offline from here on)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout (+ libatlas_less -> ATLAS_PCA_LIBLESS, inherited by the PIT minions)
        env:
          LESS: ${{ matrix.module == '' && '1' || '' }}
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - uses: actions/download-artifact@v4
        with:
          name: wasmtime-host
          path: ${{ runner.temp }}/natives
      - name: Pin the prebuilt wasmtime host (WasmSubprocessTest requires it under CI)
        run: |
          chmod +x "$RUNNER_TEMP/natives/pca-wasmtime-host"
          echo "PCA_WASMTIME_HOST_BIN=$RUNNER_TEMP/natives/pca-wasmtime-host" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_SHA256=$(sha256sum "$RUNNER_TEMP/natives/pca-wasmtime-host" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: RSA DPoP oracle corpus (generated, never committed)
        if: ${{ matrix.module == '' }}
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/java-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        if: ${{ matrix.module == '' }}
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/java-pca/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat frost-dkg:frost-dkg
      - name: Secret-key oracle corpus (abe)
        if: ${{ matrix.module == 'pairing' }}
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/java-pca/adapters/pca-pairing/test-data" abe:abe
      # ---- opt-in adapter modules: the same native-library setup as each module's own workflow (pairing.yml, fhe.yml, lwe-ot.yml, fndsa.yml, zk.yml) ----
      - name: blst at the pinned commit + GT shim (libpcagt.so)
        if: ${{ matrix.module == 'pairing' }}
        working-directory: ${{ env.MONO }}/sdks/java-pca/adapters/pca-pairing
        run: |
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          mkdir -p target/native
          cc -O2 -fPIC -shared -D__BLST_PORTABLE__ \
            -I"$RUNNER_TEMP/blst/bindings" -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o target/native/libpcagt.so \
            src/main/c/pca_gt.c src/main/c/pca_gt_jni.c "$RUNNER_TEMP/blst/src/server.c" "$RUNNER_TEMP/blst/build/assembly.S"
          echo "MOD_JVM_ARGS=-Dpca.gt.lib=$PWD/target/native/libpcagt.so" >> "$GITHUB_ENV"
      - name: node-seal reference corpus + libsealc at the pinned SEAL tag
        if: ${{ matrix.module == 'fhe-seal' }}
        run: |
          .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
          lib="$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so"
          echo "MOD_JVM_ARGS=-Dpca.sealc.lib=$lib -Dpca.fhe.corpus=$RUNNER_TEMP/fhe-seal.json.gz -Dpca.fhe.required=true" >> "$GITHUB_ENV"
      - name: liblweot (cargo build --features capi)
        if: ${{ matrix.module == 'mpc-lwe-ot' }}
        run: echo "MOD_JVM_ARGS=-Dpca.lweot.lib=$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so -Dpca.lweot.required=true" >> "$GITHUB_ENV"
      - name: libfndsa (cargo build --features capi)
        if: ${{ matrix.module == 'fndsa' }}
        run: |
          echo "ATLAS_PCA_LIBFNDSA=$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$MONO/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBFNDSA_REQUIRED=1" >> "$GITHUB_ENV"
      - name: libpcazk (cargo build --features capi)
        if: ${{ matrix.module == 'zk' }}
        run: |
          echo "ATLAS_PCA_LIBPCAZK=$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$MONO/packages/pca-zk/crate" | tail -1)/libpcazk.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBPCAZK_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Install the core library (the adapters depend on it)
        if: ${{ matrix.module != '' }}
        working-directory: ${{ env.MONO }}/sdks/java-pca
        run: mvn -B -ntp -q install -DskipTests
      - name: Baseline PIT history (targeted mode)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
          SHARD: ${{ matrix.shard }}
          TAG: ${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pit-history-in"
          ids="$BASELINE"
          if [ -z "$ids" ]; then
            ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch "$GITHUB_REF_NAME" --limit 20 \
                     --json databaseId -q '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" || true)"
          fi
          for id in $ids; do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "pit-history-$TAG" -D "$RUNNER_TEMP/pit-history-in" 2>/dev/null \
               && [ -s "$RUNNER_TEMP/pit-history-in/pit-history.txt" ]; then
              echo "PIT_HISTORY_IN=$RUNNER_TEMP/pit-history-in/pit-history.txt" >> "$GITHUB_ENV"
              echo "targeted: shard $TAG seeded from run $id"; exit 0
            fi
          done
          echo "::notice::shard $SHARD: no baseline PIT history found, full run (seeds the history for the next run)"
      - name: Re-measure dead mutants (targeted mode)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) && env.PIT_HISTORY_IN != '' }}
        # PIT may reuse a carried TIMED_OUT / MEMORY_ERROR / RUN_ERROR result when the class and its covering tests look unchanged,
        # so a new deadline test would never re-measure it. Every history record is one serialized mutant result (base64, one per
        # line): drop the records whose status is one of those three, so PIT has no previous result and runs the mutant again.
        run: |
          python3 - <<'PY'
          import base64, os
          p = os.environ["PIT_HISTORY_IN"]
          keep, drop = [], 0
          for ln in open(p):
              t = ln.strip()
              if not t:
                  continue
              b = base64.b64decode(t + "=" * (-len(t) % 4))
              if b"TIMED_OUT" in b or b"MEMORY_ERROR" in b or b"RUN_ERROR" in b:
                  drop += 1
              else:
                  keep.append(ln if ln.endswith("\n") else ln + "\n")
          open(p, "w").writelines(keep)
          print(f"targeted: dropped {drop} dead-minion history record(s), kept {len(keep)}")
          PY
      - name: The run's coverage map (covmap jobs)
        if: ${{ matrix.module == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: covmap-*
          path: ${{ runner.temp }}/covmap
          merge-multiple: true
      - name: Mutate
        if: ${{ matrix.module == '' }}
        working-directory: ${{ env.MONO }}/sdks/java-pca
        env:
          SHARD: ${{ matrix.shard }}
          PART: ${{ matrix.part }}
          ONLY: ${{ inputs.only }}
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
          PCA_OOM_CONTROL: ${{ inputs.oom_control && '1' || '' }}
        run: |
          # the shard's class set replaces the pom's targetClasses (an explicit pom setting wins over -DtargetClasses)
          python3 - <<'PY'
          import json, os, re
          plan = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], ".github/scripts/mutation-plan.json")))
          p = plan["package"]
          sl = plan["slices"][int(os.environ["SHARD"]) - 1]
          # PIT 1.17.1 'ALL' mutator names (the pitest jar's Mutator / StandardMutatorGroups / experimental classes). A slice that names `mut`
          # (group letters), `mutators` or `mutators_except` runs only those mutators over its classes; the parts of one class set partition ALL.
          ALL = ["CONDITIONALS_BOUNDARY", "CONSTRUCTOR_CALLS", "EMPTY_RETURNS", "EXPERIMENTAL_ARGUMENT_PROPAGATION", "EXPERIMENTAL_BIG_DECIMAL",
                 "EXPERIMENTAL_BIG_INTEGER", "EXPERIMENTAL_MEMBER_VARIABLE", "EXPERIMENTAL_NAKED_RECEIVER", "EXPERIMENTAL_SWITCH", "FALSE_RETURNS",
                 "INCREMENTS", "INLINE_CONSTS", "INVERT_NEGS", "MATH", "NEGATE_CONDITIONALS", "NON_VOID_METHOD_CALLS", "NULL_RETURNS",
                 "PRIMITIVE_RETURNS", "REMOVE_CONDITIONALS_EQUAL_ELSE", "REMOVE_CONDITIONALS_EQUAL_IF", "REMOVE_CONDITIONALS_ORDER_ELSE",
                 "REMOVE_CONDITIONALS_ORDER_IF", "REMOVE_INCREMENTS", "REMOVE_SWITCH", "TRUE_RETURNS", "VOID_METHOD_CALLS"]
          GRP = {"n": ["NON_VOID_METHOD_CALLS"],
                 "c": ["NEGATE_CONDITIONALS", "CONDITIONALS_BOUNDARY", "EXPERIMENTAL_ARGUMENT_PROPAGATION", "EXPERIMENTAL_MEMBER_VARIABLE",
                       "EXPERIMENTAL_NAKED_RECEIVER", "EXPERIMENTAL_SWITCH", "EXPERIMENTAL_BIG_DECIMAL", "EXPERIMENTAL_BIG_INTEGER"],
                 "r": ["REMOVE_CONDITIONALS_EQUAL_IF", "REMOVE_CONDITIONALS_EQUAL_ELSE", "REMOVE_CONDITIONALS_ORDER_IF", "REMOVE_CONDITIONALS_ORDER_ELSE", "INLINE_CONSTS"]}
          GRP["x"] = [m for m in ALL if not any(m in v for v in GRP.values())]
          def mutators_of(sl):
              ms = sl.get("mutators") or ([m for g in sl["mut"] for m in GRP[g]] if sl.get("mut") else None) \
                  or ([m for m in ALL if m not in sl["mutators_except"]] if sl.get("mutators_except") else None)
              assert ms is None or (ms and set(ms) <= set(ALL)), f"unknown or empty mutator list: {ms}"
              return ms
          xml = lambda g: g.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
          par = lambda xs: "".join(f"<param>{xml(p + '.' + x)}</param>" for x in xs)
          if sl.get("rest"):
              named = sorted({c for q in plan["slices"] for c in q.get("classes", [])})
              block = f"<targetClasses><param>{p}.*</param></targetClasses><excludedClasses>{par(named)}</excludedClasses>"
          else:
              block = f"<targetClasses>{par(sl['classes'])}</targetClasses>"
              if sl.get("exclude_methods"):
                  block += "<excludedMethods>" + "".join(f"<param>{xml(g)}</param>" for g in sl["exclude_methods"]) + "</excludedMethods>"
          s = open("pom.xml").read()
          assert "<excludedMethods>" not in s, "the pom already sets excludedMethods"
          s2 = re.sub(r"<targetClasses>.*?</targetClasses>", lambda m: block, s, count=1, flags=re.S)
          assert s2 != s, "targetClasses not found in pom.xml"
          ms = mutators_of(sl)
          if ms:
              s2, n = re.subn(r"<mutators>.*?</mutators>", lambda m: "<mutators>" + "".join(f"<mutator>{x}</mutator>" for x in ms) + "</mutators>", s2, count=1, flags=re.S)
              assert n == 1, "mutators not found in pom.xml"
          if os.environ.get("PCA_OOM_CONTROL") == "1":
              s2, n = re.subn(r"<targetTests>.*?</targetTests>", f"<targetTests><param>{p}.BaseOomControlTest</param></targetTests>", s2, count=1, flags=re.S)
              assert n == 1, "targetTests not found in pom.xml"
          open("pom.xml", "w").write(s2)
          print(sl.get("label"), "-", len(block), "chars of target block")
          PY
          # the minions' real heap and every GC, kept in the PIT log below
          sed -i 's#<arg>-Xss8m</arg>#<arg>-Xss8m</arg><arg>-Xlog:gc,gc+init:stdout</arg>#' pom.xml
          # cheaper minion JVMs (one JVM per mutant makes the start-up the cost): one GC thread per JVM (four JVMs share four CPUs; G1 stays, because PIT's
          # memory watchdog reads the G1 old-gen pool and the serial collector would shrink it), and an AppCDS archive of the
          # classes every minion loads. None of them changes what a test computes. The archive is made once, by a one-minion PIT run over a
          # 4-mutant class with the archive created at exit (threads 1: no two JVMs write it); the real run only maps it (no AutoCreate), and
          # the flag is added only if the archive exists.
          mvn -B -ntp -q test-compile
          # the slice's part (method / mutator bins) and its target tests: only the test classes the run's coverage map says cover one of
          # its classes (PIT runs no other test against these mutants), then this part's bin of them. Fails on a missing or stale map.
          K=(--plan="$GITHUB_WORKSPACE/.github/scripts/mutation-plan.json" --shard="$SHARD" --part="$PART" --pom=pom.xml --classes=target/classes
             --covmap="$RUNNER_TEMP/covmap" --of="$COVMAP_SHARES" --test-root=test --weights="$GITHUB_WORKSPACE/.github/scripts/mutation-test-weights.json")
          [ "${PCA_OOM_CONTROL:-}" = 1 ] && K+=(--tests=keep)
          python3 "$GITHUB_WORKSPACE/.github/scripts/mutation-parts.py" shard-pom "${K[@]}"
          python3 - <<'PY'
          import re
          s = open("pom.xml").read()
          t = re.sub(r"<targetClasses>.*?</targetClasses>", "<targetClasses><param>net.atlasauth.pca.A2a$ReceiptChain</param></targetClasses>", s, count=1, flags=re.S)
          t = t.replace("<arg>-Xss8m</arg>", "<arg>-Xss8m</arg><arg>-XX:+AutoCreateSharedArchive</arg><arg>-XX:SharedArchiveFile=/tmp/pca-app.jsa</arg><arg>-Xlog:cds=info,cds+dynamic=info:file=/tmp/pca-cds-prime.log</arg>", 1)
          open("pom-prime.xml", "w").write(t)
          PY
          rm -f /tmp/pca-app.jsa
          mvn -B -ntp -f pom-prime.xml org.pitest:pitest-maven:mutationCoverage -Dthreads=1 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true -DreportsDirectory="$RUNNER_TEMP/pit-prime" > "$RUNNER_TEMP/pit-prime.log" 2>&1 || true
          rm -f pom-prime.xml
          CDS=""; if [ -s /tmp/pca-app.jsa ]; then CDS="<arg>-XX:SharedArchiveFile=/tmp/pca-app.jsa</arg><arg>-Xshare:auto</arg>"; echo "AppCDS archive: $(stat -c %s /tmp/pca-app.jsa) bytes"; else
            # say why (the prime's own output is not in the job log otherwise): PIT's verdict and the JVM's CDS log
            echo "::warning::no AppCDS archive was created (the minions start without it)"
            grep -aE 'PIT >> (SEVERE|WARNING)|ERROR|Exception|Generated [0-9]+ mutations|coverage and dependency|Error occurred|cds' "$RUNNER_TEMP/pit-prime.log" | head -40 || true
            [ -f /tmp/pca-cds-prime.log ] && grep -aiE 'error|warn|unable|disabled|skip|dump|archive' /tmp/pca-cds-prime.log | head -40 || echo "(no CDS log: the minion JVM never started with the archive flags)"
          fi
          sed -i "s#<arg>-Xss8m</arg>#<arg>-Xss8m</arg><arg>-XX:ParallelGCThreads=1</arg><arg>-XX:ConcGCThreads=1</arg>$CDS#" pom.xml
          # negative control: the JVM flag really ends a process on OutOfMemoryError with the line the Report step counts
          printf 'class Oom { public static void main(String[] a) { System.out.println(new long[Integer.MAX_VALUE - 8].length); } }' > "$RUNNER_TEMP/Oom.java"
          if java -XX:+ExitOnOutOfMemoryError -Xmx64m "$RUNNER_TEMP/Oom.java" > "$RUNNER_TEMP/oom.out" 2>&1; then echo "::error::the out-of-memory control did not exit"; exit 1; fi
          grep -q 'Terminating due to java.lang.OutOfMemoryError' "$RUNNER_TEMP/oom.out" || { cat "$RUNNER_TEMP/oom.out"; echo "::error::the out-of-memory control printed no termination line"; exit 1; }
          mvn -B -ntp -q test-compile
          # -DmutationUnitSize=1: every mutant gets its own minion JVM. PIT otherwise keeps one JVM per class group and applies one mutant after
          # another in it, so a test class whose static initialiser (or a static cache) first runs under a mutant stores that mutant's
          # result or its failure for every later mutant, and tests that read it fail for a reason that has nothing to do with them
          # (a false KILLED). The test sources hold ~75 such static fields that call main code, 10 static blocks and a parsed-fixture
          # cache; a fresh JVM per mutant removes the whole class without touching them (and without the heap carried between mutants).
          hist=(-DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt")
          mkdir -p "$RUNNER_TEMP/pit-history-out"
          [ -n "${PIT_HISTORY_IN:-}" ] && hist+=(-DhistoryInputFile="$PIT_HISTORY_IN")
          PIT_T0=$(date +%s)
          # the PIT output only reaches the log at the end: a heartbeat every 5 min shows how far a shard cut at its limit got
          ( while sleep 300; do echo "progress $(date -u +%H:%M): $(grep -ac 'Heap Max Capacity' "$RUNNER_TEMP/pit.log" 2>/dev/null) minion JVMs started; $(grep -a 'PIT >> INFO' "$RUNNER_TEMP/pit.log" 2>/dev/null | tail -1 | cut -c1-160)"; done ) & HB=$!; trap 'kill $HB 2>/dev/null || true' EXIT
          mvn -B -ntp org.pitest:pitest-maven:mutationCoverage -Dthreads=4 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true "${hist[@]}" 2>&1 | tee "$RUNNER_TEMP/pit.log" | tail -40
          kill $HB 2>/dev/null || true
          PIT_T1=$(date +%s)
          MUTS=$(grep -aoE 'Generated [0-9]+ mutations' "$RUNNER_TEMP/pit.log" | tail -1 | grep -oE '[0-9]+' || echo 0)
          EXP=$(python3 -c "import json,os;print(json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'.github/scripts/mutation-plan.json')))['slices'][int(os.environ['SHARD'])-1]['mutants'])")
          echo "plan check: ${MUTS:-0} mutants generated, ${EXP} expected from the plan for the whole slice${PART:+ (this is part $PART of it)}"
          echo "pass 1 wall time: $((PIT_T1-PIT_T0)) s for ${MUTS:-0} mutants: $(awk -v t=$((PIT_T1-PIT_T0)) -v m=${MUTS:-1} 'BEGIN{printf "%.1f", t/(m>0?m:1)}') s per mutant (wall, 4 threads)"
          # proof that -DmutationUnitSize=1 took effect: one JVM per mutant, so the JVM starts (one 'Heap Max Capacity' line each) are about the mutant count
          echo "minion JVMs started in pass 1: $(grep -ac 'Heap Max Capacity' "$RUNNER_TEMP/pit.log"); $(grep -aoE 'Generated [0-9]+ mutations' "$RUNNER_TEMP/pit.log" | tail -1)"
          # Second pass (behaviour-preserving mutants die of GC pauses and heap pressure, not of their own doing): every mutant that
          # ended TIMED_OUT / MEMORY_ERROR / RUN_ERROR is measured once more on its own, alone, at twice the time limit and twice
          # the heap. Its history record is dropped, so PIT has no previous result and runs only those mutants; everything else is
          # carried from the first pass. Only the second pass counts: a mutant that is dead again needs a proof in the merge.
          X1="$(find target/pit-reports -name mutations.xml | head -1)"
          DEAD="$(grep -cE 'status=.(TIMED_OUT|MEMORY_ERROR|RUN_ERROR)' "$X1" || true)"
          if [ "${DEAD:-0}" -gt 0 ] && [ -s "$RUNNER_TEMP/pit-history-out/pit-history.txt" ]; then
            echo "second pass: re-measuring $DEAD dead mutant(s) at twice the limit and a 5 GB heap, two JVMs at a time"
            cp "$RUNNER_TEMP/pit.log" "$RUNNER_TEMP/pit-pass1.log"
            python3 - <<'PY'
          import base64, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "pit-history-out", "pit-history.txt")
          keep = []
          for ln in open(p):
              t = ln.strip()
              if not t:
                  continue
              b = base64.b64decode(t + "=" * (-len(t) % 4))
              if not (b"TIMED_OUT" in b or b"MEMORY_ERROR" in b or b"RUN_ERROR" in b):
                  keep.append(t + "\n")
          open(os.path.join(os.environ["RUNNER_TEMP"], "pit-history-pass2-in.txt"), "w").writelines(keep)
          PY
            sed -i 's#<timeoutFactor>3.0</timeoutFactor>#<timeoutFactor>6.0</timeoutFactor>#; s#<timeoutConstant>15000</timeoutConstant>#<timeoutConstant>30000</timeoutConstant>#; s#<arg>-Xmx3g</arg>#<arg>-Xmx5g</arg>#' pom.xml
            # the PIT output only reaches the log at the end: a heartbeat every 5 min shows how far a shard cut at its limit got
            ( while sleep 300; do echo "progress $(date -u +%H:%M): $(grep -ac 'Heap Max Capacity' "$RUNNER_TEMP/pit.log" 2>/dev/null) minion JVMs started; $(grep -a 'PIT >> INFO' "$RUNNER_TEMP/pit.log" 2>/dev/null | tail -1 | cut -c1-160)"; done ) & HB=$!; trap 'kill $HB 2>/dev/null || true' EXIT
            mvn -B -ntp org.pitest:pitest-maven:mutationCoverage -Dthreads=2 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true \
              -DhistoryInputFile="$RUNNER_TEMP/pit-history-pass2-in.txt" -DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt" 2>&1 | tee "$RUNNER_TEMP/pit.log" | tail -40
            kill $HB 2>/dev/null || true
          fi
          # PIT's watchdog exits a minion at 90% of ANY pool (heap, code cache, ...) and reports MEMORY_ERROR with no real OutOfMemoryError: name the pools
          grep -oE '[A-Za-z0-9 _'"'"'-]+ has exceeded the shutdown threshold' "$RUNNER_TEMP/pit.log" | sort | uniq -c || true
          grep -aoE 'Heap Max Capacity: [^ ]+' "$RUNNER_TEMP/pit.log" | sort | uniq -c || true
          grep -aoE '[0-9]+M->[0-9]+M\([0-9]+M\)' "$RUNNER_TEMP/pit.log" | sed -E 's/.*\(([0-9]+)M\)/\1/' | sort -n | tail -1 | sed 's/^/largest heap capacity in a GC line (MB): /' || true
      - name: Mutate (adapter module)
        if: ${{ matrix.module != '' }}
        working-directory: ${{ env.MONO }}/sdks/java-pca/adapters
        env:
          MODULE: ${{ matrix.module }}
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
        run: |
          # the module's own PIT configuration, the core's settings (every mutator, one JVM per mutant, same limits); the module pom has none
          case "$MODULE" in
            pairing)    DIR=pca-pairing;     CLS="pairing abe bbs aggsig"; TESTS="net.atlasauth.pca.*.*Test" ;;
            fhe-seal)   DIR=pca-fhe-seal;    CLS="fhe.seal";               TESTS="net.atlasauth.pca.fhe.seal.*Test" ;;
            mpc-lwe-ot) DIR=pca-mpc-lwe-ot;  CLS="mpc.lwe";                TESTS="net.atlasauth.pca.mpc.lwe.*Test" ;;
            fndsa)      DIR=pca-fndsa;       CLS="fndsa";                  TESTS="net.atlasauth.pca.fndsa.*Test" ;;
            zk)         DIR=pca-zk;          CLS="zk";                     TESTS="net.atlasauth.pca.zk.*Test" ;;
          esac
          cd "$DIR"
          CLS="$CLS" TESTS="$TESTS" python3 - <<'PY'
          import os, re
          p = "net.atlasauth.pca."
          # the fndsa package is shared with the core library: only the adapter's own classes
          classes = [p + "fndsa.NativeFnDsa*"] if os.environ["CLS"] == "fndsa" else [p + c + ".*" for c in os.environ["CLS"].split()]
          args = [a for a in os.environ.get("MOD_JVM_ARGS", "").split() if a]
          jvm = "".join(f"<arg>{a}</arg>" for a in ["-Xss8m", "-Xmx3g", "-XX:ReservedCodeCacheSize=1g", "-XX:+ExitOnOutOfMemoryError", "-XX:-OmitStackTraceInFastThrow", "-XX:SoftRefLRUPolicyMSPerMB=0", "-XX:ParallelGCThreads=1", "-XX:ConcGCThreads=1", "-Xlog:gc,gc+init:stdout"] + args)
          plugin = ("<plugin><groupId>org.pitest</groupId><artifactId>pitest-maven</artifactId><version>1.17.1</version>"
                    "<dependencies><dependency><groupId>org.pitest</groupId><artifactId>pitest-junit5-plugin</artifactId><version>1.2.1</version></dependency></dependencies>"
                    "<configuration><targetClasses>" + "".join(f"<param>{c}</param>" for c in classes) + "</targetClasses>"
                    "<targetTests><param>" + os.environ["TESTS"] + "</param></targetTests>"
                    "<mutators><mutator>ALL</mutator></mutators><timeoutFactor>3.0</timeoutFactor><timeoutConstant>15000</timeoutConstant>"
                    "<outputFormats><format>XML</format></outputFormats><exportLineCoverage>true</exportLineCoverage><failWhenNoMutations>false</failWhenNoMutations>"
                    "<parseSurefireArgLine>false</parseSurefireArgLine><jvmArgs>" + jvm + "</jvmArgs></configuration></plugin>")
          s = open("pom.xml").read()
          assert "pitest" not in s and "</plugins>" in s
          open("pom.xml", "w").write(s.replace("</plugins>", plugin + "</plugins>", 1))
          PY
          mvn -B -ntp -q test-compile
          mkdir -p "$RUNNER_TEMP/pit-history-out"
          hist=(-DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt")
          [ -n "${PIT_HISTORY_IN:-}" ] && hist+=(-DhistoryInputFile="$PIT_HISTORY_IN")
          # the PIT output only reaches the log at the end: a heartbeat every 5 min shows how far a shard cut at its limit got
          ( while sleep 300; do echo "progress $(date -u +%H:%M): $(grep -ac 'Heap Max Capacity' "$RUNNER_TEMP/pit.log" 2>/dev/null) minion JVMs started; $(grep -a 'PIT >> INFO' "$RUNNER_TEMP/pit.log" 2>/dev/null | tail -1 | cut -c1-160)"; done ) & HB=$!; trap 'kill $HB 2>/dev/null || true' EXIT
          mvn -B -ntp org.pitest:pitest-maven:1.17.1:mutationCoverage -Dthreads=4 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true "${hist[@]}" 2>&1 | tee "$RUNNER_TEMP/pit.log" | tail -40
          kill $HB 2>/dev/null || true
          grep -aoE 'Generated [0-9]+ mutations' "$RUNNER_TEMP/pit.log" | tail -1
          # second pass, as for the core: a mutant that ended TIMED_OUT / MEMORY_ERROR / RUN_ERROR is measured once more alone at twice the limit and heap
          X1="$(find target/pit-reports -name mutations.xml | head -1)"
          DEAD="$(grep -cE 'status=.(TIMED_OUT|MEMORY_ERROR|RUN_ERROR)' "$X1" || true)"
          if [ "${DEAD:-0}" -gt 0 ] && [ -s "$RUNNER_TEMP/pit-history-out/pit-history.txt" ]; then
            python3 - <<'PY'
          import base64, os
          t = os.environ["RUNNER_TEMP"]
          keep = []
          for ln in open(os.path.join(t, "pit-history-out", "pit-history.txt")):
              x = ln.strip()
              if not x:
                  continue
              b = base64.b64decode(x + "=" * (-len(x) % 4))
              if not (b"TIMED_OUT" in b or b"MEMORY_ERROR" in b or b"RUN_ERROR" in b):
                  keep.append(x + "\n")
          open(os.path.join(t, "pit-history-pass2-in.txt"), "w").writelines(keep)
          PY
            cp "$RUNNER_TEMP/pit.log" "$RUNNER_TEMP/pit-pass1.log"
            sed -i 's#<timeoutFactor>3.0</timeoutFactor>#<timeoutFactor>6.0</timeoutFactor>#; s#<timeoutConstant>15000</timeoutConstant>#<timeoutConstant>30000</timeoutConstant>#; s#<arg>-Xmx3g</arg>#<arg>-Xmx5g</arg>#' pom.xml
            # the PIT output only reaches the log at the end: a heartbeat every 5 min shows how far a shard cut at its limit got
            ( while sleep 300; do echo "progress $(date -u +%H:%M): $(grep -ac 'Heap Max Capacity' "$RUNNER_TEMP/pit.log" 2>/dev/null) minion JVMs started; $(grep -a 'PIT >> INFO' "$RUNNER_TEMP/pit.log" 2>/dev/null | tail -1 | cut -c1-160)"; done ) & HB=$!; trap 'kill $HB 2>/dev/null || true' EXIT
            mvn -B -ntp org.pitest:pitest-maven:1.17.1:mutationCoverage -Dthreads=2 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true \
              -DhistoryInputFile="$RUNNER_TEMP/pit-history-pass2-in.txt" -DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt" 2>&1 | tee "$RUNNER_TEMP/pit.log" | tail -40
            kill $HB 2>/dev/null || true
          fi
      - name: Keep the PIT log, GC lines included
        if: ${{ always() }}
        run: if [ -f "$RUNNER_TEMP/pit.log" ]; then gzip -c "$RUNNER_TEMP/pit.log" > pit-log-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.gz; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pit-log-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: pit-log-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.gz
          retention-days: 7
          if-no-files-found: ignore
      - name: Report
        run: |
          # a minion killed by -XX:+ExitOnOutOfMemoryError logs this line; the merge compares the count with the shard's RUN_ERROR mutants
          OOM="$(grep -ac 'Terminating due to java.lang.OutOfMemoryError' "$RUNNER_TEMP/pit.log" || true)"
          echo "OutOfMemoryError exits: $OOM"
          echo "{\"count\":${OOM:-0}}" > oom-${{ matrix.shard }}.json
          X="$(find "$MONO/sdks/java-pca/target/pit-reports" "$MONO"/sdks/java-pca/adapters/*/target/pit-reports -name mutations.xml 2>/dev/null | head -1)"
          if [ -z "$X" ]; then
            # PIT writes no report for a slice without mutants: fine only when the plan expects none (the catch-all rest shard); any other shard without a report is an error
            EXPR=$(python3 -c "import json,os;print(json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'.github/scripts/mutation-plan.json')))['slices'][${{ matrix.shard }}-1]['mutants'])")
            if { [ "$EXPR" = "0" ] || [ -n "${{ matrix.part }}" ]; } && grep -aqE 'Generated 0 mutations|Skipping coverage and analysis as no mutations found' "$RUNNER_TEMP/pit.log"; then mkdir -p "$RUNNER_TEMP/empty-report"; printf '<?xml version="1.0" encoding="UTF-8"?>\n<mutations>\n</mutations>\n' > "$RUNNER_TEMP/empty-report/mutations.xml"; X="$RUNNER_TEMP/empty-report/mutations.xml"; echo "empty slice: no mutants expected, none generated"
            else echo "::error::no mutations.xml"; exit 1; fi
          fi
          if [ -n "${{ matrix.part }}" ]; then
            # one part of a split slice: the merge combines the parts' reports into the shard's (mutation-parts.py combine)
            cp "$X" "mutations-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.xml"; mv "oom-${{ matrix.shard }}.json" "oom-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.json"
            echo "{\"count\":$(grep -cE "status=.RUN_ERROR" "$X" || true)}" > "runerr-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.json"
            echo "part ${{ matrix.part }} of shard ${{ matrix.shard }}: $(grep -c '<mutation ' "$X" || true) mutant(s), statuses: $(grep -oE "status='[A-Z_]+'" "$X" | sort | uniq -c | tr '\n' ' ')"
            exit 0
          fi
          node "$MONO/tools/pca-audit/native-mutation/pit-convert.mjs" "$CRATE" "$X" results.json survivors-raw.json
          node -e '
            const fs = require("fs"); const r = JSON.parse(fs.readFileSync("results.json", "utf8"));
            const counts = {}; for (const m of r) counts[m.st] = (counts[m.st] || 0) + 1;
            const s = JSON.parse(fs.readFileSync("survivors-raw.json", "utf8")).map(({ status, ...x }) => x);
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(s));
            // detected without a failing test (the minion died or hung): listed for audit, so none passes unseen
            const odd = r.filter((m) => ["MEMORY_ERROR", "RUN_ERROR", "TIMED_OUT", "NON_VIABLE"].includes(m.st));
            fs.writeFileSync("errs-${{ matrix.shard }}.json", JSON.stringify(odd));
            // killed by a failing test: lets the merge tell a borderline hang that a test decided this run from a stale confirmation
            fs.writeFileSync("killed-${{ matrix.shard }}.json", JSON.stringify(r.filter((m) => m.st === "KILLED")));
            fs.writeFileSync("files-${{ matrix.shard }}.json", JSON.stringify([...new Set(r.map((m) => m.file))]));
            if (odd.length) console.log(`::warning::shard ${{ matrix.shard }}: ${odd.length} mutant(s) ended without a failing test: ${JSON.stringify(counts)}`);
          '
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=pitest \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.part != '' }}
        with:
          name: shardpart-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: |
            mutations-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.xml
            oom-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.json
            runerr-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.part == '' }}
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            errs-${{ matrix.shard }}.json
            oom-${{ matrix.shard }}.json
            files-${{ matrix.shard }}.json
            killed-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: pit-history-${{ matrix.shard }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: ${{ runner.temp }}/pit-history-out/pit-history.txt
          retention-days: 30
          if-no-files-found: warn

