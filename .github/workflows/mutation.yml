name: Mutation

# Mutation testing of the verifier with PIT (pom.xml: ALL mutators, oracle = MutationHarness + the JUnit suites), split
# into shards by target class (the last shard takes every class the others do not, so the shards partition the pom's
# targetClasses exactly). PIT reports are converted with the flagship's tools/pca-audit/native-mutation/pit-convert.mjs and
# the merge job checks the survivors (SURVIVED + NO_COVERAGE) against the equivalent-mutant ledger: it passes when every
# survivor is a ledgered equivalent and no ledger entry is stale. Runs on demand and on ci/** branches (the
# release-candidate check), never on main pushes.
#
# TARGETED mode (the default whenever a baseline exists): every shard uploads its PIT history (pit-history-<k>) and the next
# run feeds it back (historyInputFile), so PIT re-runs ONLY what can have changed: mutants of a class whose bytecode changed
# (any edited line), SURVIVED mutants whose covering tests changed (new kill tests), and NO_COVERAGE mutants (re-analysed
# against fresh coverage). Untouched KILLED / TIMED_OUT / SURVIVED results are carried forward from the history, so each
# shard still reports the COMPLETE mutant set and the merge checks the ledger over the full picture. Baseline = the input
# `baseline_run`, else the newest earlier run of this workflow on the same branch that uploaded the shard's history; none
# (or `full: true`) = a full run, which seeds the history for the next one.
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'run id whose pit-history-<k> artifacts seed a targeted run (default: newest earlier run on this branch)'
        required: false
        default: ''
      only:
        description: 'Experiment: run only these shards (comma-separated); the merge stays red'
        type: string
        default: ''
      oom_control:
        description: 'Negative control (with only=18): only K05OomControlTest runs, and a mutant it catches dies of a real OutOfMemoryError. It must score a run error, never a kill.'
        type: boolean
        default: false
      full:
        description: 'ignore any baseline history: mutate everything'
        type: boolean
        default: false
  push:
    branches: ['ci/**']

permissions:
  contents: read
  actions: read   # download the baseline run's pit-history artifacts

concurrency:
  # a push supersedes an earlier push run; a dispatched (queue) run is never killed by a later push to the branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CRATE: java-pca
  SHARDS: '134'
  P: net.atlasauth.pca
  # Maven Central answers HTTP 429 when many shards start together: wait and retry instead of losing the shard
  MAVEN_ARGS: -Daether.transport.http.retryHandler.count=8 -Daether.transport.http.retryHandler.interval=15000

jobs:
  shard:
    name: shard ${{ matrix.shard }}/134 (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 256 # Enterprise plan: 500 concurrent jobs org-wide; GitHub queues anything above that
      matrix:
        include:
          # generated from .github/scripts/mutation-plan.json (one shard per slice, the number is the 1-based position); label is for the job name only
          - { shard: 1, label: 'ArgProvenance.verifyChain' }
          - { shard: 2, label: 'Json.ser' }
          - { shard: 3, label: 'Json$Parser.number' }
          - { shard: 4, label: 'Json$Parser.object' }
          - { shard: 5, label: 'Json.numberError' }
          - { shard: 6, label: 'Pca.decodeB64uStrict' }
          - { shard: 7, label: 'Pca.validateWireV2' }
          - { shard: 8, label: 'ArgProvenance.decide' }
          - { shard: 9, label: 'IntentV2.modelRules' }
          - { shard: 10, label: 'Json.jsString' }
          - { shard: 11, label: 'IntentV2.decide' }
          - { shard: 12, label: 'Actions.closure+12' }
          - { shard: 13, label: 'ParamProvenance+3' }
          - { shard: 14, label: 'Actions$Profile+6' }
          - { shard: 15, label: 'ProvenanceGate+4' }
          - { shard: 16, label: 'IntentRevocation+2' }
          - { shard: 17, label: 'OracleFacts.decide' }
          - { shard: 18, label: 'K3+3' }
          - { shard: 19, label: 'AttestIntel.bad+8' }
          - { shard: 20, label: 'SafeRegex+2' }
          - { shard: 21, label: 'AttestNvidia+5' }
          - { shard: 22, label: 'ActionRegistry.M+12' }
          - { shard: 23, label: 'Mesh.verify' }
          - { shard: 24, label: 'Pq+2' }
          - { shard: 25, label: 'AttestXml$Node+18' }
          - { shard: 26, label: 'Pca.allocationsError+4' }
          - { shard: 27, label: 'Authorize.decisive+4' }
          - { shard: 28, label: 'Agent+3' }
