          - { shard: 30, label: 'Decision+3' }
          - { shard: 31, label: 'Sigstore.verifySigstoreBundleCore' }
          - { shard: 32, label: 'PolicyAuthoring+4' }
          - { shard: 33, label: 'IntentHistory+7' }
          - { shard: 34, label: 'Actions.attestRefusal+6' }
          - { shard: 35, label: 'Predicates.narrowestUnmet+2' }
          - { shard: 36, label: 'Pca.badPointEncoding+10' }
          - { shard: 37, label: 'CaveatLang+1' }
          - { shard: 38, label: 'PlanRegistry+11' }
          - { shard: 39, label: 'AttestIntelCollateral+2' }
          - { shard: 40, label: 'AttestNvidiaOcsp+3' }
          - { shard: 41, label: 'Actions.normalize' }
          - { shard: 42, label: 'ActionSchema.canonDec+6' }
          - { shard: 43, label: 'Pca.asStr+3' }
          - { shard: 44, label: 'IntentClassifier+5' }
          - { shard: 45, label: 'IntentAcc.accSelects+6' }
          - { shard: 46, label: 'Issue.attenuate+5' }
