          - { shard: 143, module: fndsa, label: 'adapter pca-fndsa (module shard: its classes come from the workflow, none from this plan)' }
          - { shard: 144, module: zk, label: 'adapter pca-zk (module shard: its classes come from the workflow, none from this plan)' }
          - { shard: 145, label: 'MeshFederation' }
          - { shard: 146, part: '1.1.1', label: 'PqQuorum' }
          - { shard: 146, part: '2.1.1', label: 'PqQuorum' }
          - { shard: 146, part: '3.1.1', label: 'PqQuorum' }
          - { shard: 146, part: '4.1.1', label: 'PqQuorum' }
          - { shard: 147, label: 'SafetyCertificate' }
          - { shard: 148, label: 'Zk+ZkCeremony+ZkBundled' }
          - { shard: 149, part: '1.1.1', label: 'Kem+Entropy' }
          - { shard: 149, part: '2.1.1', label: 'Kem+Entropy' }
          - { shard: 150, part: '1.1.1', label: 'GoalSemantics.applies+22 (argument propagation, negate)' }
          - { shard: 150, part: '2.1.1', label: 'GoalSemantics.applies+22 (argument propagation, negate)' }
          - { shard: 151, part: '1.1.1', label: 'GoalSemantics.applies+22 (remove-conditionals, constants)' }
          - { shard: 151, part: '2.1.1', label: 'GoalSemantics.applies+22 (remove-conditionals, constants)' }
          - { shard: 151, part: '3.1.1', label: 'GoalSemantics.applies+22 (remove-conditionals, constants)' }
          - { shard: 151, part: '4.1.1', label: 'GoalSemantics.applies+22 (remove-conditionals, constants)' }
          - { shard: 151, part: '5.1.1', label: 'GoalSemantics.applies+22 (remove-conditionals, constants)' }
          - { shard: 151, part: '6.1.1', label: 'GoalSemantics.applies+22 (remove-conditionals, constants)' }
          - { shard: 152, label: 'GoalSemantics.applies+22 (remaining mutators)' }
          - { shard: 153, label: 'ActionSchemaDraft+1 (0.6 surface)' }
          - { shard: 154, label: 'AgentNative (0.6 surface)' }
          - { shard: 155, label: 'AgentPassport+4 (0.6 surface)' }
          - { shard: 156, part: '1.1.1', label: 'AttestAllowlist+3 (0.6 surface)' }
          - { shard: 156, part: '2.1.1', label: 'AttestAllowlist+3 (0.6 surface)' }
