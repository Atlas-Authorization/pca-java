name: Mutation

# Mutation testing of the verifier with PIT (pom.xml: ALL mutators, oracle = MutationHarness + the JUnit suites), split
# into shards by target class (the last shard takes every class the others do not, so the shards partition the pom's
# targetClasses exactly). PIT reports are converted with the flagship's tools/pca-audit/native-mutation/pit-convert.mjs and
# the merge job checks the survivors (SURVIVED + NO_COVERAGE) against the equivalent-mutant ledger: it passes when every
# survivor is a ledgered equivalent and no ledger entry is stale. Runs on demand and on ci/** branches (the
# release-candidate check), never on main pushes.
#
# TARGETED mode (the default whenever a baseline exists): every shard uploads its PIT history (pit-history-<k>) and the next
# run feeds it back (historyInputFile), so PIT re-runs ONLY what can have changed: mutants of a class whose bytecode changed
# (any edited line), SURVIVED mutants whose covering tests changed (new kill tests), and NO_COVERAGE mutants (re-analysed
# against fresh coverage). Untouched KILLED / TIMED_OUT / SURVIVED results are carried forward from the history, so each
# shard still reports the COMPLETE mutant set and the merge checks the ledger over the full picture. Baseline = the input
# `baseline_run`, else the newest earlier run of this workflow on the same branch that uploaded the shard's history; none
# (or `full: true`) = a full run, which seeds the history for the next one.
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'run id whose pit-history-<k> artifacts seed a targeted run (default: newest earlier run on this branch)'
        required: false
        default: ''
      only:
        description: 'Experiment: run only these shards (comma-separated); the merge stays red'
        type: string
        default: ''
      oom_control:
        description: 'Negative control (with only=18): only BaseOomControlTest runs, and a mutant it catches dies of a real OutOfMemoryError. It must score a run error, never a kill.'
        type: boolean
        default: false
      full:
        description: 'ignore any baseline history: mutate everything'
        type: boolean
        default: false
  push:
    branches: ['ci/**', '!ci/build-**']

permissions:
  contents: read
  actions: read   # download the baseline run's pit-history artifacts

concurrency:
  # a push supersedes an earlier push run; a dispatched (queue) run is never killed by a later push to the branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CRATE: java-pca
  SHARDS: '440'
  # the coverage map is measured once per run in this many covmap jobs (each: every class, a share of the test classes)
  COVMAP_SHARES: '8'
  P: net.atlasauth.pca
  BLST_TAG: v0.3.16
  BLST_COMMIT: e7f90de551e8df682f3cc99067d204d8b90d27ad
  SEAL_TAG: v4.1.2
  # Maven Central answers HTTP 429 when many shards start together: wait and retry instead of losing the shard
  # The shards run Maven OFFLINE (-o) against the repository the `deps` job resolved once, so a shard can never fetch from the network and one
  # transient Maven Central failure cannot sink a shard; a plugin or dependency missing from that cache fails the shard loudly. Maven 3.9 (the
  # runner's) reads MAVEN_ARGS and its resolver honours aether.transport.http.retryHandler.*; the wagon property covers an older Maven.
  MAVEN_ARGS: -Daether.transport.http.retryHandler.count=8 -Daether.transport.http.retryHandler.interval=15000 -Dmaven.wagon.http.retryHandler.count=8 -o

jobs:
  reuse:
    name: reuse check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      hash: ${{ steps.reuse.outputs.hash }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      # input-hash reuse (ci-reuse.mjs): when an earlier run recorded the same input hash, every other job of this run is skipped.
      # continue-on-error: a failing check can only mean "no reuse"; FORCE_FULL / force_full / [force-full] bypass it.
      - id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || inputs.full || vars.FORCE_FULL == '1' || contains(github.event.head_commit.message, '[force-full]') }}
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          PARTIAL: ${{ inputs.only != '' || inputs.oom_control }}
          EXTRA: ''
        run: node .github/scripts/ci-reuse.mjs check --workflow=mutation --self=.github/workflows/mutation.yml --external=flagship --extra="$EXTRA"
  deps:
    name: Maven plugins and dependencies (resolved once)
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_ARGS: -Daether.transport.http.retryHandler.count=8 -Daether.transport.http.retryHandler.interval=15000 -Dmaven.wagon.http.retryHandler.count=8
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '23'
      - name: JDK again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
      - name: The job runs on the expected JDK
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "'23 || { echo "::error::the expected JDK is not the active JDK"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        env:
          LESS: ''
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: Cache key (the poms and this workflow)
        id: key
        shell: bash
        run: echo "key=m2-pit-$(find "$MONO/sdks/java-pca" -name pom.xml -not -path '*/target/*' | sort | xargs sha256sum | sha256sum | cut -c1-16)-${{ hashFiles('.github/workflows/mutation.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Resolve every plugin and dependency once (the only job that fetches)
        working-directory: ${{ env.MONO }}/sdks/java-pca
        shell: bash
        run: |
          mvn --version
          # the PIT plugin with its junit5 plugin, every other build plugin, and every project dependency
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:resolve-plugins
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:go-offline
          # compile and install the core once: pulls the compiler / jar / install plugins and their dependencies, and lets the adapters resolve it
          mvn -B -ntp -q install -DskipTests
          # the adapter modules the shards mutate: their own dependencies (the shards add the same pitest plugin, already resolved above)
          for d in pca-pairing pca-fhe-seal pca-mpc-lwe-ot pca-fndsa pca-zk; do
            (cd "adapters/$d" && mvn -B -ntp dependency:go-offline && mvn -B -ntp dependency:resolve-plugins && mvn -B -ntp -q test-compile)
          done
          # the exact PIT invocation a shard runs, once, on one tiny class and test: Maven resolves everything PIT loads (the plugin's own
          # dependencies such as pitest-junit5-plugin, PIT's runtime jars), which resolve-plugins and go-offline do not fetch
          python3 - <<'PY'
          import re
          s = open("pom.xml").read()
          s, a = re.subn(r"<targetClasses>.*?</targetClasses>", "<targetClasses><param>net.atlasauth.pca.A2a$ReceiptChain</param></targetClasses>", s, count=1, flags=re.S)
          s, b = re.subn(r"<targetTests>.*?</targetTests>", "<targetTests><param>net.atlasauth.pca.WellTypedKillTest</param></targetTests>", s, count=1, flags=re.S)
          assert a == 1 and b == 1, "targetClasses / targetTests not found in pom.xml"
          open("pom.xml", "w").write(s)
          PY
          PIT=(org.pitest:pitest-maven:1.17.1:mutationCoverage -Dthreads=1 -DmutationUnitSize=1 -DtimestampedReports=false -DskipFailingTests=true -DreportsDirectory="$RUNNER_TEMP/pit-deps")
          mvn -B -ntp "${PIT[@]}"
          rm -rf "$RUNNER_TEMP/pit-deps"
          # offline proof: the same invocation with no network; a missing artifact fails this job, not every shard
          mvn -B -ntp -o "${PIT[@]}"
      - name: The shard matrix matches the plan, and the parts tool passes its self-test
        run: |
          python3 .github/scripts/mutation-parts.py selftest
          python3 .github/scripts/mutation-parts.py check-matrix --plan=.github/scripts/mutation-plan.json --workflow=.github/workflows/mutation.yml
      - name: Save the resolved repository for the shards
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.key.outputs.key }}

  # The reference wasmtime host, built once for every shard: WasmSubprocessTest (a PIT-covered suite) fails under CI without
  # PCA_WASMTIME_HOST_BIN / PCA_WASMTIME_HOST_SHA256, and a shard must not build it itself.
  wasmhost:
    name: wasmtime host (built once)
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        env:
          LESS: ''
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: Build the host
        run: |
          set -euo pipefail
          N="$RUNNER_TEMP/natives"; mkdir -p "$N"
          bin="$(.github/scripts/build-wasmtime-host.sh "$RUNNER_TEMP/wasmtime-host" "$MONO/packages/pca-sandbox/wasmtime-host" | tail -1)"
          cp "$bin" "$N/pca-wasmtime-host"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-host
          path: ${{ runner.temp }}/natives/pca-wasmtime-host
          retention-days: 7

  # The coverage map, once per run: PIT's coverage phase (the whole suite) used to run in every shard (20-35 min each, twice with a second pass).
  # Each covmap job runs it over EVERY class with a share of the test classes and no mutant to test, and keeps class -> covering test
  # classes; the shards then name only those test classes as targetTests (mutation-parts.py; it refuses a missing, partial or stale map).
  covmap:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: [reuse, deps, wasmhost]
    name: coverage map share ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: libsodium (ristretto255 / Ed25519 backend)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; elif [ "$RUNNER_OS" = macOS ]; then brew install libsodium; fi
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true  # a transient download failure must not leave the later steps on the runner's default JDK
        with:
          distribution: temurin
          # 23, not 21: LESS runs through the FFM API (JDK 22+). On 21 LessNative never loaded, so its mutants and every
          # LESS branch of Pq/Pca were NO_COVERAGE or survived untested (ci.yml runs the same build on 23 with --less)
          java-version: '23'
      - name: JDK again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
      - name: The job runs on the expected JDK
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "'23 || { echo "::error::the expected JDK is not the active JDK"; exit 1; }
      - name: Restore the Maven repository resolved by the deps job (offline from here on)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout (+ libatlas_less -> ATLAS_PCA_LIBLESS, inherited by the PIT minions)
        env:
          LESS: ${{ matrix.module == '' && '1' || '' }}
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - uses: actions/download-artifact@v4
        with:
          name: wasmtime-host
          path: ${{ runner.temp }}/natives
      - name: Pin the prebuilt wasmtime host (WasmSubprocessTest requires it under CI)
        run: |
          chmod +x "$RUNNER_TEMP/natives/pca-wasmtime-host"
          echo "PCA_WASMTIME_HOST_BIN=$RUNNER_TEMP/natives/pca-wasmtime-host" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_SHA256=$(sha256sum "$RUNNER_TEMP/natives/pca-wasmtime-host" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: RSA DPoP oracle corpus (generated, never committed)
        if: ${{ matrix.module == '' }}
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/java-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        if: ${{ matrix.module == '' }}
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/java-pca/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat frost-dkg:frost-dkg
      - name: Secret-key oracle corpus (abe)
        if: ${{ matrix.module == 'pairing' }}
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/java-pca/adapters/pca-pairing/test-data" abe:abe
      # ---- opt-in adapter modules: the same native-library setup as each module's own workflow (pairing.yml, fhe.yml, lwe-ot.yml, fndsa.yml, zk.yml) ----
      - name: blst at the pinned commit + GT shim (libpcagt.so)
        if: ${{ matrix.module == 'pairing' }}
        working-directory: ${{ env.MONO }}/sdks/java-pca/adapters/pca-pairing
        run: |
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          mkdir -p target/native
          cc -O2 -fPIC -shared -D__BLST_PORTABLE__ \
            -I"$RUNNER_TEMP/blst/bindings" -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o target/native/libpcagt.so \
            src/main/c/pca_gt.c src/main/c/pca_gt_jni.c "$RUNNER_TEMP/blst/src/server.c" "$RUNNER_TEMP/blst/build/assembly.S"
          echo "MOD_JVM_ARGS=-Dpca.gt.lib=$PWD/target/native/libpcagt.so" >> "$GITHUB_ENV"
      - name: node-seal reference corpus + libsealc at the pinned SEAL tag
        if: ${{ matrix.module == 'fhe-seal' }}
        run: |
          .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
          lib="$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so"
          echo "MOD_JVM_ARGS=-Dpca.sealc.lib=$lib -Dpca.fhe.corpus=$RUNNER_TEMP/fhe-seal.json.gz -Dpca.fhe.required=true" >> "$GITHUB_ENV"
      - name: liblweot (cargo build --features capi)
        if: ${{ matrix.module == 'mpc-lwe-ot' }}
        run: echo "MOD_JVM_ARGS=-Dpca.lweot.lib=$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so -Dpca.lweot.required=true" >> "$GITHUB_ENV"
      - name: libfndsa (cargo build --features capi)
        if: ${{ matrix.module == 'fndsa' }}
        run: |
          echo "ATLAS_PCA_LIBFNDSA=$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$MONO/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBFNDSA_REQUIRED=1" >> "$GITHUB_ENV"
      - name: libpcazk (cargo build --features capi)
        if: ${{ matrix.module == 'zk' }}
        run: |
          echo "ATLAS_PCA_LIBPCAZK=$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$MONO/packages/pca-zk/crate" | tail -1)/libpcazk.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBPCAZK_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Install the core library (the adapters depend on it)
        if: ${{ matrix.module != '' }}
        working-directory: ${{ env.MONO }}/sdks/java-pca
        run: mvn -B -ntp -q install -DskipTests
      - name: Coverage-only PIT run over this share of the test classes
        working-directory: ${{ env.MONO }}/sdks/java-pca
        env:
          PART: ${{ matrix.part }}
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
        run: |
          S="$GITHUB_WORKSPACE/.github/scripts"
          [ "$(python3 -c "import json,os;print(len(json.load(open('$S/mutation-plan.json'))['slices']))")" = "$SHARDS" ] || { echo "::error::plan / SHARDS mismatch"; exit 1; }
          python3 "$S/mutation-parts.py" covmap-prep --part="$PART" --of="$COVMAP_SHARES" --pom=pom.xml --test-root=test --src-dir=src \
            --weights="$S/mutation-test-weights.json" --meta="$RUNNER_TEMP/covmap-meta.json"
          mvn -B -ntp -q test-compile
          T0=$(date +%s)
          mvn -B -ntp org.pitest:pitest-maven:mutationCoverage -Dthreads=1 -DtimestampedReports=false -DreportsDirectory="$RUNNER_TEMP/pit-covmap" 2>&1 \
            | tee "$RUNNER_TEMP/pit-covmap.log" | { grep -aE 'PIT >> (INFO|WARNING|SEVERE)|BUILD|ERROR' || true; }
          echo "coverage-only run: $(( $(date +%s) - T0 )) s"
          grep -aq 'coverage and dependency analysis' "$RUNNER_TEMP/pit-covmap.log" || { echo "::error::PIT ran no coverage phase"; exit 1; }
          [ -s "$RUNNER_TEMP/pit-covmap/linecoverage.xml" ] || { echo "::error::PIT wrote no linecoverage.xml"; ls -la "$RUNNER_TEMP/pit-covmap" || true; exit 1; }
          mkdir -p "$RUNNER_TEMP/covmap-out"
          python3 "$S/mutation-parts.py" covmap-reduce --xml="$RUNNER_TEMP/pit-covmap/linecoverage.xml" --meta="$RUNNER_TEMP/covmap-meta.json" \
            --test-root=test --weights="$S/mutation-test-weights.json" --out="$RUNNER_TEMP/covmap-out/covmap-$PART.json"
      - uses: actions/upload-artifact@v4
        with:
          name: covmap-${{ matrix.part }}
          path: ${{ runner.temp }}/covmap-out/covmap-${{ matrix.part }}.json
          retention-days: 7
          if-no-files-found: error

  shard:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: [reuse, deps, wasmhost, covmap]
    name: shard ${{ matrix.shard }}/440${{ matrix.part && format(' part {0}', matrix.part) || '' }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4 # fair share: about 24 runners per PCA repo (10 repos, about 180 shared runners); one repo must never starve the rest
      matrix:
        include:
          # generated by .github/scripts/mutation-parts.py gen-matrix from mutation-plan.json (matrix 1 of 7); label is for the job name only
          - { shard: 1, label: 'ArgProvenance.verifyChain [n]' }
          - { shard: 2, part: '1.1.1', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.2', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.3', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.4', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.5', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.6', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.7', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.8', label: 'Json.ser [n]' }
          - { shard: 2, part: '1.1.9', label: 'Json.ser [n]' }
          - { shard: 3, part: '1.1.1', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.2', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.3', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.4', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.5', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.6', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.7', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.8', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.9', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.10', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.11', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.12', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.13', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.14', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.15', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.16', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.17', label: 'Json$Parser.number [n]' }
          - { shard: 3, part: '1.1.18', label: 'Json$Parser.number [n]' }
          - { shard: 4, part: '1.1.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.1.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.2.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.2.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.3.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.3.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.4.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.4.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.5.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.5.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.6.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.6.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.7.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.7.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.8.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.8.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.9.1', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.9.2', label: 'Json$Parser.object [n+x]' }
          - { shard: 4, part: '1.10.1', label: 'Json$Parser.object [n+x]' }
