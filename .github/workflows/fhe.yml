name: FHE (BFV on Microsoft SEAL)

# adapters/pca-fhe-seal: the homomorphic risk gate through JNA over Microsoft SEAL's own C export API (libsealc, built here from the pinned SEAL
# tag). Wire compatibility with the TypeScript reference (node-seal 5.1.7 = SEAL 4.1.2) is shown by replaying a corpus generated here by the
# reference: the native evaluator must reproduce the reference's evaluated ciphertexts byte for byte (re-saved uncompressed).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEAL_TAG: v4.1.2
  CMAKE_POLICY_VERSION_MINIMUM: "3.5" # SEAL's bundled zlib declares cmake_minimum_required below 3.5; CMake 4 rejects that

jobs:
  fhe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono java-pca
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: node-seal reference corpus
        run: .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz"
      - name: libsealc at the pinned SEAL tag
        run: echo "SEALC_LIB=$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so" >> "$GITHUB_ENV"
      - name: Install the core library
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q install -DskipTests
      - name: BFV replay and round trip
        working-directory: ${{ env.PCA_MONO_SDK }}/adapters/pca-fhe-seal
        run: mvn -B -ntp test -Dpca.sealc.lib="$SEALC_LIB" -Dpca.fhe.corpus="$RUNNER_TEMP/fhe-seal.json.gz" -Dpca.fhe.required=true
