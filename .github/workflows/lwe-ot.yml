name: Endemic LWE base OT

# adapters/pca-mpc-lwe-ot: the post-quantum endemic base OT through JNA over a small C library (liblweot) that wraps the audited pqc_kyber
# K-PKE (built here from the flagship's crate). The native replays the TypeScript reference corpus, byte for byte.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lwe-ot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (full shared corpus and the lattice crate from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono java-pca
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: liblweot (cargo build --features capi)
        run: echo "LWEOT_LIB=$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$RUNNER_TEMP/mono/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so" >> "$GITHUB_ENV"
      - name: Install the core library
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp -q install -DskipTests
      - name: Endemic OT replay
        working-directory: ${{ env.PCA_MONO_SDK }}/adapters/pca-mpc-lwe-ot
        run: mvn -B -ntp test -Dpca.lweot.lib="$LWEOT_LIB" -Dpca.lweot.required=true
